[package]
name = "lbs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
argon2 = { version = "0.6", features = ["password-hash", "getrandom"] }
askama = "0.16.0"
axum = { version = "0.8.9", features = ["query"] }
clap = "4.6.1"
dotenv = "0.15.0"
fastembed = "5.17.2"
rand = "0.10.1"
rand_core = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlite-vec = "0.1.9"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.3", features = ["v4"] }
derive_more = { version = "2.1.1", features = ["display", "error", "from"] }
axum-test = "21.0.0"
tower = "0.5.3"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
zerocopy = "0.8.55"
bytemuck = "1.25.2"
ordered-float = "5.5.0"
futures = "0.3.34"
jsonwebtoken = "11.0.0"
axum-extra = { version = "0.12.6", features = ["typed-header"] }

[dependencies.libsqlite3-sys]
version = ">=0.30.1, <0.38.0"
